<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d0b" />
    <title>Tsushima Explorer — Feudal Japan</title>
  </head>
  <body>
    <div id="loading" aria-live="polite">
      <div class="loading-inner">
        <div class="loading-kicker">A FEUDAL JAPAN OPEN-WORLD STUDY</div>
        <h1>TSUSHIMA<br /><em>EXPLORER</em></h1>
        <div class="loading-rule"></div>
        <div class="loading-track"><div id="loading-progress"></div></div>
        <div id="loading-text">Preparing the valley…</div>
        <div class="loading-credit">Assets via Poly Haven (CC0) · Girl model CC-BY-4.0</div>
      </div>
    </div>

    <div id="hud" class="hud" aria-label="Performance HUD">
      <div class="hud-title">TSUSHIMA EXPLORER</div>
      <div class="hud-stats">
        <span><b id="hud-fps">—</b> FPS</span>
        <span><b id="hud-calls">—</b> CALLS</span>
        <span><b id="hud-tris">—</b> TRIS</span>
      </div>
      <div class="hud-credit">Assets via Poly Haven (CC0)</div>
    </div>

    <div class="world-hint">WASD / arrows · Shift sprint · drag to orbit · scroll zoom</div>
    <div class="world-mark">SENSE // WORLD 01</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
